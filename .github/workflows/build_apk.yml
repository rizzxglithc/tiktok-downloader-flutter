name: Build TikTok Downloader Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Prepare Release Artifacts
        run: |
          mkdir -p output
          cp build/app/outputs/flutter-apk/app-release.apk output/tiktok.apk
          ls -lh output/tiktok.apk

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-downloader-apk
          path: output/tiktok.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v1.0.0-build-${{ github.run_number }}
          name: TikTok Downloader v1.0.0 (Build ${{ github.run_number }})
          body: |
            ## TikTok Downloader Mobile Application
            Production build generated automatically via GitHub Actions CI/CD.
            - **Platform:** Android 5.0+ (API 21+)
            - **Architecture:** Universal APK
          files: output/tiktok.apk
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
