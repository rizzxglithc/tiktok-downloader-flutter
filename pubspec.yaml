name: tiktok_downloader
description: "A premium modern TikTok Downloader mobile application built with Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Architecture
  provider: ^6.1.2

  # Networking & Streaming Downloads
  dio: ^5.4.3+1

  # Media Playback
  video_player: ^2.8.6

  # Image Caching
  cached_network_image: ^3.3.1

  # File Storage & Device Paths
  path_provider: ^2.1.3
  open_filex: ^4.4.0
  share_plus: ^9.0.0
  shared_preferences: ^2.2.3
  permission_handler: ^11.3.1

  # UI, Icons, Animations & Utilities
  intl: ^0.19.0
  flutter_animate: ^4.5.0
  flutter_spinkit: 5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
